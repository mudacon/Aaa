<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ▼検索対策：ここの文章を直すだけでOK -->
<title>イラスト採点AI｜あなたの絵を無料でAI診断</title>
<meta name="description" content="イラストをアップロードするだけで、AIが色使い・構図・表現力・独創性を採点。前回との点数比較や得意分野の分析もできる無料のイラスト診断サイトです。">
<meta property="og:title" content="イラスト採点AI｜あなたの絵を無料でAI診断">
<meta property="og:description" content="絵をアップロードするだけでAIが採点。成長も記録できます。">
<meta property="og:type" content="website">
<!-- ▲ここまで -->
<style>
/* ▼色の設定：ここを変えると全体の色が変わります */
:root{--bg:#F2F4F8;--card:#FFFFFF;--ink:#1D2330;--sub:#6A7287;--line:#DDE1EA;--accent:#3D5AFE;--accent-ink:#FFFFFF;--mark:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--card:#1B2030;--ink:#EEF1F7;--sub:#9AA3B8;--line:#2B3246;--accent:#7C8FFF;--accent-ink:#12151C}}
:root[data-theme="dark"]{--bg:#12151C;--card:#1B2030;--ink:#EEF1F7;--sub:#9AA3B8;--line:#2B3246;--accent:#7C8FFF;--accent-ink:#12151C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
button,.btn{display:inline-block;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:1rem;font-weight:700;cursor:pointer}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.ghost{background:none;color:var(--sub);font-weight:400;padding:6px 0;font-size:.85rem;text-decoration:underline}
.hidden{display:none}
#preview{width:100%;max-height:300px;object-fit:contain;border-radius:10px;margin-top:12px;background:var(--bg)}
.score{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.9rem}
.diff{font-weight:700;margin:0}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem}
.bar span:first-child{width:4.5em;flex:none}
.bar i{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--accent)}
.bar span:last-child{width:2.2em;text-align:right}
.note{color:var(--sub);font-size:.85rem}
ul{padding-left:1.2em;margin:6px 0}
mark{background:var(--mark);color:#1D2330;padding:0 4px;border-radius:3px}
</style>
</head>
<body>
<main>
  <h1>イラスト採点AI</h1>
  <p class="lead">絵をアップロードすると、AIが4項目で採点します。</p>

  <!-- 名前登録（初回のみ） -->
  <section id="setup" class="card hidden">
    <h2>はじめに名前を決めてください</h2>
    <input type="text" id="nameInput" maxlength="12" placeholder="ニックネーム（12文字まで）">
    <p class="note">あなた専用のIDは自動で発行されます。</p>
    <button id="startBtn">はじめる</button>
  </section>

  <!-- メイン -->
  <section id="app" class="hidden">
    <div class="card">
      <p id="hello" style="margin:0 0 12px"></p>
      <label class="btn" for="file" tabindex="0">イラストを選ぶ</label>
      <input type="file" id="file" accept="image/*" class="hidden">
      <img id="preview" class="hidden" alt="アップロードしたイラスト">
      <p id="loading" class="hidden">採点中…</p>
      <p id="error" class="hidden" role="alert" style="color:#D93025;font-weight:700"></p>
    </div>

    <div id="result" class="card hidden">
      <div class="score">
        <div class="ring" id="ring"><b id="total">0</b></div>
        <div><p class="diff" id="diff"></p><p class="note" id="comment"></p></div>
      </div>
      <div id="bars"></div>
    </div>

    <div id="trendCard" class="card hidden">
      <h2>あなたの傾向</h2>
      <ul id="trend"></ul>
    </div>

    <div id="historyCard" class="card hidden">
      <h2>最近の記録</h2>
      <ul id="history"></ul>
      <button class="ghost" id="resetBtn">記録を消す</button>
    </div>
    <p class="note">アップロードした絵は採点のためにAIサービス（Google）へ送信されます。無料枠では、Googleがサービス改善に利用する場合があります。このサイトでは画像そのものは保存しません。</p>
  </section>
</main>

<script>
// ▼設定：項目名や待ち時間はここで変更
const CONFIG={categories:['色使い','構図','表現力','独創性'],apiUrl:'/api/judge',timeoutMs:12000};
const $=id=>document.getElementById(id);
let user=null,resetArmed=false;

// --- ユーザー情報（今はブラウザ内に保存。後でデータベースに置き換え可能）
try{user=JSON.parse(localStorage.getItem('illust_user'))}catch(e){}
function save(){try{localStorage.setItem('illust_user',JSON.stringify(user))}catch(e){}}
function makeId(){return 'U-'+Math.random().toString(36).slice(2,8).toUpperCase()}

function show(){
  const has=!!user;
  $('setup').classList.toggle('hidden',has);
  $('app').classList.toggle('hidden',!has);
  if(has){$('hello').textContent=user.name+'さん（ID: '+user.id+'）';renderExtras()}
}
$('startBtn').onclick=()=>{
  const n=$('nameInput').value.trim();
  if(!n){$('nameInput').focus();return}
  user={id:makeId(),name:n,history:[]};save();show();
};

// --- 画像を縮小（速く判定するため）
function resize(file){return new Promise((ok,ng)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1024/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.8))};
  img.onerror=ng;img.src=url;
})}

// --- 判定（Gemini：サーバー /api/judge 経由。失敗したら理由を表示）
async function judge(image){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),CONFIG.timeoutMs);
  let r;
  try{
    r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image}),signal:ctl.signal});
  }catch(e){
    throw new Error(e.name==='AbortError'?'時間内に結果が返りませんでした。もう一度試してください。':'サーバーに接続できません。Vercelで公開したURLで開いていますか？');
  }finally{clearTimeout(t)}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok||!d.scores)throw new Error(d.error||'採点に失敗しました（'+r.status+'）');
  return d;
}
function showError(msg){$('error').textContent=msg;$('error').classList.remove('hidden')}

$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('result').classList.add('hidden');$('error').classList.add('hidden');$('loading').classList.remove('hidden');
  try{
    const img=await resize(f);
    $('preview').src=img;$('preview').classList.remove('hidden');
    const d=await judge(img);
    const vals=CONFIG.categories.map(c=>d.scores[c]);
    const total=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    const prev=user.history[user.history.length-1];
    user.history.push({t:Date.now(),total,scores:d.scores});
    user.history=user.history.slice(-30);save();
    showResult(d,total,prev);renderExtras();
  }catch(err){showError(err&&err.message?err.message:'画像を読み込めませんでした。別の画像で試してください。')}
  $('loading').classList.add('hidden');e.target.value='';
};

function showResult(d,total,prev){
  $('result').classList.remove('hidden');
  $('total').textContent=total;$('ring').style.setProperty('--p',total);
  $('comment').textContent=d.comment||'';
  let msg='初めての採点です！';
  if(prev){const k=total-prev.total;
    msg=k>0?'前回より +'+k+'点アップ！':k<0?'前回より '+k+'点。次は上げよう！':'前回と同じ点数でした';}
  $('diff').textContent=msg;
  $('bars').innerHTML='';
  CONFIG.categories.forEach(c=>{const v=d.scores[c];const row=document.createElement('div');row.className='bar';
    row.innerHTML='<span></span><i><u></u></i><span></span>';
    row.children[0].textContent=c;row.children[1].firstChild.style.width=v+'%';row.children[2].textContent=v;
    $('bars').appendChild(row)});
}

// --- 傾向分析と履歴
function renderExtras(){
  const h=user.history;
  $('trendCard').classList.toggle('hidden',h.length<2);
  $('historyCard').classList.toggle('hidden',h.length<1);
  if(h.length>=2){
    const avg=c=>Math.round(h.reduce((a,x)=>a+x.scores[c],0)/h.length);
    const best=CONFIG.categories.reduce((a,c)=>avg(c)>avg(a)?c:a);
    const cur=h[h.length-1],pre=h[h.length-2];
    const up=CONFIG.categories.reduce((a,c)=>cur.scores[c]-pre.scores[c]>cur.scores[a]-pre.scores[a]?c:a);
    const gain=cur.scores[up]-pre.scores[up];
    const li=[];
    li.push('得意な項目：'+best+'（平均'+avg(best)+'点）');
    if(gain>0)li.push('最も伸びた項目：'+up+'（+'+gain+'点）');
    $('trend').innerHTML='';li.forEach(s=>{const x=document.createElement('li');x.textContent=s;$('trend').appendChild(x)});
  }
  $('history').innerHTML='';
  h.slice(-5).reverse().forEach(x=>{const li=document.createElement('li');
    const d=new Date(x.t);li.textContent=(d.getMonth()+1)+'/'+d.getDate()+'　'+x.total+'点';$('history').appendChild(li)});
}
$('resetBtn').onclick=()=>{
  if(!resetArmed){resetArmed=true;$('resetBtn').textContent='もう一度押すと記録を消します';return}
  user.history=[];save();resetArmed=false;$('resetBtn').textContent='記録を消す';$('result').classList.add('hidden');renderExtras();
};
$('file').previousElementSibling.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
show();
</script>
</body>
</html>
